name: mutants

# Mutation testing with cargo-mutants (config: .cargo/mutants.toml).
# Pull requests: only the mutants in the changed lines. Pushes to main: all.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Cargo.toml', '.cargo/mutants.toml', '.github/workflows/mutants.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.toml', '.cargo/mutants.toml', '.github/workflows/mutants.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CENTRIFUGO_VERSION: 5.4.9

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Linux system deps (webkit for tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Without it the e2e tests skip and most mutants survive.
      - name: Install Centrifugo
        run: |
          mkdir -p "$RUNNER_TEMP/centrifugo"
          cd "$RUNNER_TEMP/centrifugo"
          file="centrifugo_${CENTRIFUGO_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/centrifugal/centrifugo/releases/download/v${CENTRIFUGO_VERSION}/${file}"
          tar xzf "$file"
          echo "$RUNNER_TEMP/centrifugo" >> "$GITHUB_PATH"

      - name: Mutants in the PR diff
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          cargo mutants -j 2 --in-diff pr.diff

      - name: All mutants
        if: github.event_name != 'pull_request'
        run: cargo mutants -j 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out
          path: mutants.out
